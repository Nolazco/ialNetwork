<VirtualHost *:80>
    DocumentRoot /app/public
    DirectoryIndex index.php

    <Directory /app/public>
        AllowOverride None
        Require all granted

        # Reescribe cualquier URL desconocida al front controller de Symfony.
        FallbackResource /index.php
    </Directory>

    # Los assets de los bundles se sirven tal cual, sin pasar por Symfony.
    <Directory /app/public/bundles>
        FallbackResource disabled
    </Directory>

    # public/build/ no lleva hash en el nombre en dev (enableVersioning solo
    # aplica en produccion), asi que tras cada "npm run dev" el archivo cambia
    # pero la URL no. Sin este header el navegador confia en el Last-Modified
    # viejo (heuristica de frescura) y sigue sirviendo el JS/CSS de antes del
    # rebuild sin siquiera revalidar, dando bugs fantasma dificiles de
    # diagnosticar. Forzar revalidacion en cada carga es barato (server local)
    # y solo aplica aqui: este vhost es exclusivo del contenedor de dev.
    <Directory /app/public/build>
        FallbackResource disabled
        Header set Cache-Control "no-cache"
    </Directory>

    # Los archivos subidos tampoco pasan por el front controller.
    #
    # Y sobre todo: aqui NO se ejecuta codigo. Los documentos que suben clientes,
    # ejecutivos y contadores caen bajo public/, asi que sin esto un .php subido
    # se ejecutaria y cualquier formulario de carga seria ejecucion remota de
    # codigo. Se apaga el motor y ademas se niega el acceso a las extensiones
    # ejecutables, por si el modulo cambia.
    <Directory /app/public/uploads>
        FallbackResource disabled

        php_admin_flag engine off

        SetHandler none
        RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phar
        RemoveType .php .phtml .php3 .php4 .php5 .php7 .php8 .phar

        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

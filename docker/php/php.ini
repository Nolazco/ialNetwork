; Ajustes de desarrollo para IAL Network.

; El alta de pedimentos sube varios documentos a la vez.
upload_max_filesize = 32M
post_max_size = 64M
max_file_uploads = 40

memory_limit = 512M
max_execution_time = 120

date.timezone = America/Mexico_City

; En dev queremos ver los errores en el log del contenedor.
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Opcache con revalidación para que los cambios en PHP se reflejen al vuelo.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

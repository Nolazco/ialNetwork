
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # Dentro de la red de compose la base se resuelve por el nombre del servicio.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
    volumes:
      # El codigo que se edita a mano se comparte con el host.
      - .:/app
      # Todo lo demas vive en volumenes. El bind mount de Windows pasa por WSL2
      # y es ~60x mas lento que el disco del contenedor: una peticion de Symfony
      # en dev abre >1000 archivos de vendor/ y escribe var/cache en cada
      # request, lo que costaba ~6s por pagina.
      - vendor:/app/vendor
      - var:/app/var
      - node_modules:/app/node_modules
      # Conserva las descargas de Composer y npm entre recreaciones del contenedor.
      - package_cache:/root/.cache
      # La configuracion de Apache y PHP tambien va horneada en la imagen; aqui se
      # monta encima para poder ajustarla sin reconstruir.
      - ./docker/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-app.ini:ro
    ports:
      - "8000:80"

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # El esquema lo construyen las migraciones y los datos de prueba salen de
      # las fixtures, asi que ya no se siembra desde backup.sql:
      #   docker compose exec app php bin/console doctrine:migrations:migrate
      #   docker compose exec app php bin/console doctrine:fixtures:load
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  vendor:
  var:
  node_modules:
  package_cache:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Sin ruta a "async": no hay ningun worker corriendo
            # (messenger:consume) que vacie esa cola, asi que enrutar el
            # correo ahi lo dejaria atorado para siempre. Se manda sincrono,
            # que es lo correcto para un correo puntual como el de modulacion.
            # Route your messages to the transports
            # 'App\Message\YourMessage': async

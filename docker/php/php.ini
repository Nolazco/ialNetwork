; Ajustes de desarrollo para IAL Network.

; El alta de pedimentos sube varios documentos a la vez.
upload_max_filesize = 32M
post_max_size = 64M
max_file_uploads = 40

memory_limit = 512M
max_execution_time = 120

date.timezone = America/Mexico_City

; En dev queremos ver los errores en el log del contenedor.
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Opcache. validate_timestamps sigue activo para no tener que reiniciar el
; contenedor al editar codigo, pero con revalidate_freq = 2 PHP consulta la
; fecha de cada archivo a lo mucho una vez cada 2 segundos en vez de en cada
; peticion. Sobre el bind mount de Windows esa diferencia es enorme.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Cache de rutas resueltas. Por defecto es pequeña y caduca rapido, asi que PHP
; termina re-resolviendo las mismas rutas contra un sistema de archivos lento.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

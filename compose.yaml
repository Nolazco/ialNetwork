
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # Dentro de la red de compose la base se resuelve por el nombre del servicio.
      # Mismo motor (MariaDB) y version que producción — ver database más abajo.
      DATABASE_URL: "mysql://${MARIADB_USER:-app}:${MARIADB_PASSWORD:-!ChangeMe!}@database:3306/${MARIADB_DATABASE:-app}?serverVersion=${MARIADB_VERSION:-11.8.8-MariaDB}&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
    volumes:
      # El codigo que se edita a mano se comparte con el host.
      - .:/app
      # Todo lo demas vive en volumenes. El bind mount de Windows pasa por WSL2
      # y es ~60x mas lento que el disco del contenedor: una peticion de Symfony
      # en dev abre >1000 archivos de vendor/ y escribe var/cache en cada
      # request, lo que costaba ~6s por pagina.
      - vendor:/app/vendor
      - var:/app/var
      - node_modules:/app/node_modules
      # Conserva las descargas de Composer y npm entre recreaciones del contenedor.
      - package_cache:/root/.cache
      # La configuracion de Apache y PHP tambien va horneada en la imagen; aqui se
      # monta encima para poder ajustarla sin reconstruir.
      - ./docker/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-app.ini:ro
    ports:
      - "8000:80"

###> doctrine/doctrine-bundle ###
  database:
    # Mismo motor y version que producción (hosting compartido, MariaDB), para
    # no traducir cada migración a mano al desplegar — ver DATABASE_URL arriba.
    image: mariadb:${MARIADB_VERSION_TAG:-11.8}
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-app}
      # You should definitely change the password in production
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-!ChangeMe!}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
      # El esquema lo construyen las migraciones y los datos de prueba salen de
      # las fixtures, asi que ya no se siembra desde backup.sql:
      #   docker compose exec app php bin/console doctrine:migrations:migrate
      #   docker compose exec app php bin/console doctrine:fixtures:load
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
  vendor:
  var:
  node_modules:
  package_cache:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

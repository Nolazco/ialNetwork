framework:
    html_sanitizer:
        sanitizers:
            # Para la justificación que el ejecutivo pega del correo del
            # clasificador (ver DashboardClassifications::confirmTariffFraction()):
            # ese correo trae texto con colores, subrayado y enlaces a las
            # regulaciones citadas, así que además de la lista "segura" de
            # Symfony (negritas, listas, encabezados, enlaces...) se habilita
            # el atributo style en los elementos que el clasificador usa para
            # resaltar texto, y las tablas que a veces trae el correo.
            app.classification_justification:
                allow_safe_elements: true
                allow_elements:
                    span: [style]
                    div: [style]
                    font: [color, style]
                    p: [style]
                    li: [style]
                    h1: [style]
                    h2: [style]
                    h3: [style]
                    h4: [style]
                    table: ['*']
                    thead: ['*']
                    tbody: ['*']
                    tr: ['*']
                    td: [style]
                    th: [style]
                allowed_link_schemes: [http, https, mailto]
                allow_relative_links: false

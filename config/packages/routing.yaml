framework:
    router:
        # Para generar URLs absolutas fuera de una petición HTTP (ver
        # PollSoiaCommand, que manda el correo de modulación por cron) —
        # sin esto, url()/path() en un comando de consola arma enlaces con
        # host "localhost" sin importar el entorno.
        default_uri: '%env(APP_URL)%'

when@prod:
    framework:
        router:
            strict_requirements: null
